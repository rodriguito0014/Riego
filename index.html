<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riego</title>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
:root{color-scheme:light dark;--bg:light-dark(#eef2ea,#0d1710);--panel:light-dark(#fff,#16241a);--ink:light-dark(#14231a,#e6efe7);--mut:light-dark(#5b6b60,#93a79a);--line:light-dark(#d5ded3,#2a3b2f);--deep:#113420;--water:#2a9df4;--ok:#2f9e44;--bad:#c8402e}
*{box-sizing:border-box;min-width:0}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:0 14px;font-weight:600;cursor:pointer}
button:disabled{opacity:.45}
button:focus-visible,input:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.top{background:var(--deep);color:#eaf3e6;padding:18px 14px}
.top div{max-width:640px;margin:0 auto}
h1{font-size:24px;margin:0}
.badge{font-size:14px;color:#b8d2bb}.badge i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#888;margin-right:6px}
.badge.ok i{background:#5fd36b}.badge.bad i{background:#ff6b57}
main{max-width:640px;margin:0 auto;padding:16px 14px 120px;display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
h2{font-size:18px;margin:0 0 10px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days button{padding:0;font-size:17px}
.days button[aria-pressed=true]{background:var(--water);border-color:var(--water);color:#fff}
.quick{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.quick button{font-size:14px;min-height:38px}
.st{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.st:first-child{border-top:0}
.st input,.add input,.f input{min-height:44px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 10px}
.st input{flex:1;font-weight:800}
.add{display:flex;gap:8px;margin-top:10px}.add input{flex:1}
.z{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.z:first-child{border-top:0}.z b{font-weight:600}
.step{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step button{border:0;border-radius:0;width:44px;padding:0;font-size:20px}
.step input{width:56px;text-align:center;border:0;background:transparent;font-weight:800;font-size:16px;-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.tot{display:flex;justify-content:space-between;border-top:2px solid var(--line);padding-top:10px;margin-top:4px;font-weight:800}
.hint{color:var(--mut);font-size:14px;margin:0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
.bar div{max-width:640px;margin:0 auto;display:grid;gap:6px}
.save{background:var(--water);border-color:var(--water);color:#fff;font-size:17px;min-height:52px}
#msg{font-size:14px;text-align:center;color:var(--mut)}#msg.ok{color:var(--ok)}#msg.warn{color:var(--bad)}
.f{display:grid;gap:10px;margin-top:12px}.f label{display:grid;gap:4px;font-size:14px;font-weight:600}
summary{cursor:pointer;font-weight:700}
</style></head><body>
<header class="top"><div><h1>Programa de riego</h1><div class="badge" id="badge"><i></i>Sin conectar</div></div></header>
<main>
<section class="card"><h2>Días de riego</h2>
<div class="days" id="days"></div>
<div class="quick"><button onclick="setDays([1,1,1,1,1,1,1])">Todos</button><button onclick="setDays([1,0,1,0,1,0,1])">Alternos</button><button onclick="setDays([0,0,0,0,0,0,0])">Ninguno</button></div>
</section>
<section class="card"><h2>Horas de inicio</h2>
<div id="starts"></div>
<div class="add"><input type="time" id="ns" value="06:30" aria-label="Nueva hora"><button onclick="addStart()">Añadir</button></div>
<p class="hint" style="margin-top:8px">Cada hora riega de la zona 1 a la 6. Máximo 8 horas.</p>
</section>
<section class="card"><h2>Minutos por zona</h2>
<div id="zones"></div>
<div class="tot"><span>Cada ciclo dura</span><span id="total"></span></div>
<p class="hint" style="margin-top:8px">Con 0 minutos la zona no se riega.</p>
</section>
<details class="card" id="setup"><summary>Conexión MQTT</summary>
<form class="f" id="form">
<label>Servidor (WebSocket)<input id="url" placeholder="wss://xxxx.emqxsl.com:8084/mqtt" required></label>
<label>Usuario<input id="user" autocomplete="username" autocapitalize="off" required></label>
<label>Contraseña<input id="pass" type="password" autocomplete="current-password" required></label>
<label>Tema base<input id="base" value="riego/casa" autocapitalize="off" required></label>
<button class="save">Guardar y conectar</button>
<p class="hint">Se guarda solo en este navegador.</p>
</form></details>
</main>
<div class="bar"><div><button class="save" id="saveBtn" onclick="send()">Guardar en el ESP32</button><div id="msg"></div></div></div>
<script>
const $=id=>document.getElementById(id);
const DN=['L','M','X','J','V','S','D'],DL=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
const fm=m=>m>=60?Math.floor(m/60)+' h'+(m%60?' '+m%60+' min':''):m+' min';
let S=null,client=null,conn=false,online=null,remote=null,changed=false,sent=false;
let cfg={days:[true,true,true,true,true,true,true],starts:['07:00'],zones:[15,10,20,10,5,15]};
try{S=JSON.parse(localStorage.getItem('riego-mqtt'))}catch(e){}
const key=c=>JSON.stringify({days:c.days.map(Boolean),starts:[...c.starts].sort(),zones:c.zones.map(Number)});

function render(){
  $('days').innerHTML=DN.map((d,i)=>`<button aria-pressed="${cfg.days[i]}" aria-label="${DL[i]}" onclick="cfg.days[${i}]=!cfg.days[${i}];edit()">${d}</button>`).join('');
  $('starts').innerHTML=cfg.starts.length?cfg.starts.map((s,k)=>`<div class="st"><input type="time" value="${s}" aria-label="Hora de inicio ${k+1}" onchange="setStart(${k},this.value)"><button onclick="cfg.starts.splice(${k},1);edit()">Borrar</button></div>`).join(''):'<p class="hint">Sin horas: no regará.</p>';
  $('zones').innerHTML=cfg.zones.map((m,i)=>`<div class="z"><b>Zona ${i+1}</b><div class="step"><button onclick="setM(${i},-5)" aria-label="Menos zona ${i+1}">−</button><input type="number" inputmode="numeric" value="${m}" aria-label="Minutos zona ${i+1}" onchange="setM(${i},0,this.value)"><button onclick="setM(${i},5)" aria-label="Más zona ${i+1}">+</button></div></div>`).join('');
  $('total').textContent=fm(cfg.zones.reduce((a,b)=>a+b,0));
  status();
}
function status(){
  const m=$('msg');m.className='';
  if(!S){m.textContent='Configura la conexión MQTT abajo';m.className='warn'}
  else if(changed){m.textContent='Hay cambios sin guardar';m.className='warn'}
  else if(sent&&remote&&key(remote)!==key(cfg))m.textContent=online===false?'Enviado. Se guardará cuando el ESP32 se conecte.':'Enviando al ESP32…';
  else if(remote&&key(remote)===key(cfg)){m.textContent='Guardado en el ESP32'+(remote.saved?' · '+remote.saved:'');m.className='ok'}
  else m.textContent=conn?'Esperando datos del ESP32…':'';
  $('saveBtn').disabled=!conn;
}
function badge(){
  const b=$('badge');
  if(!S){b.className='badge';b.innerHTML='<i></i>Sin configurar';}
  else if(!conn){b.className='badge bad';b.innerHTML='<i></i>Sin conexión con el servidor';}
  else if(online===false){b.className='badge bad';b.innerHTML='<i></i>ESP32 desconectado (sigue regando con lo guardado)';}
  else if(online){b.className='badge ok';b.innerHTML='<i></i>ESP32 conectado';}
  else{b.className='badge';b.innerHTML='<i></i>Conectado al servidor';}
  status();
}
function edit(){changed=true;sent=false;render()}
function setDays(a){cfg.days=a.map(Boolean);edit()}
function setStart(k,v){if(!v)return;if(cfg.starts.includes(v)){render();return}cfg.starts[k]=v;cfg.starts.sort();edit()}
function addStart(){const v=$('ns').value;if(v&&!cfg.starts.includes(v)&&cfg.starts.length<8){cfg.starts.push(v);cfg.starts.sort();edit()}}
function setM(i,d,v){cfg.zones[i]=Math.min(240,Math.max(0,v!=null?Math.round(+v||0):cfg.zones[i]+d));edit()}
function send(){
  if(!conn)return;
  const body={days:cfg.days,starts:[...cfg.starts].sort(),zones:cfg.zones};
  client.publish(S.base+'/config',JSON.stringify(body),{qos:1,retain:true});
  changed=false;sent=true;status();
}
function connect(){
  if(client)client.end(true);
  conn=false;badge();
  client=mqtt.connect(S.url,{username:S.user,password:S.pass,clientId:'web-'+Math.random().toString(16).slice(2,10),reconnectPeriod:4000,connectTimeout:10000});
  client.on('connect',()=>{conn=true;client.subscribe([S.base+'/estado',S.base+'/online']);badge()});
  client.on('close',()=>{conn=false;badge()});
  client.on('reconnect',()=>{const b=$('badge');b.className='badge';b.innerHTML='<i></i>Reconectando…'});
  client.on('error',e=>{$('msg').textContent='Error: '+e.message;$('msg').className='warn'});
  client.on('message',(tp,msg)=>{
    const s=msg.toString();
    if(tp===S.base+'/online'){online=s==='1';badge();return}
    try{const j=JSON.parse(s);remote={days:j.days,starts:j.starts,zones:j.zones,saved:j.saved};
      if(!changed&&!sent){cfg={days:[...j.days],starts:[...j.starts],zones:[...j.zones]};render()}
      if(sent&&key(remote)===key(cfg))sent=false;
      status()}catch(e){}
  });
}
$('form').addEventListener('submit',e=>{e.preventDefault();
  S={url:$('url').value.trim(),user:$('user').value.trim(),pass:$('pass').value,base:$('base').value.trim().replace(/\/$/,'')};
  try{localStorage.setItem('riego-mqtt',JSON.stringify(S))}catch(e){}
  $('setup').open=false;connect()});
if(S){$('url').value=S.url;$('user').value=S.user;$('base').value=S.base;connect()}else $('setup').open=true;
render();badge();
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){hiddenAt=Date.now();return}if(S&&(!conn||Date.now()-hiddenAt>5000))connect()});
window.addEventListener('pageshow',e=>{if(e.persisted&&S)connect()});
</script></body></html>
